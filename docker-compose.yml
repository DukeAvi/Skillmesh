services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: skillmesh
      POSTGRES_PASSWORD: skillmesh
      POSTGRES_DB: skillmesh
    ports:
      # ${POSTGRES_PORT:-5432} avoids colliding with a host-installed PostgreSQL on 5432.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Every *.sql here runs once, alphabetically, on first boot of an empty pgdata.
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillmesh -d skillmesh"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/skillmesh123
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"   # HTTP - Neo4j Browser
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"   # Bolt - used by the Python driver
    volumes:
      - neo4jdata:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget --no-verbose --tries=1 --spider http://localhost:7474 2>/dev/null
          || curl -fsS http://localhost:7474 >/dev/null 2>&1
          || cypher-shell -u neo4j -p skillmesh123 'RETURN 1' >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # 6380 avoids colliding with a host-installed Redis on its default 6379.
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    environment:
      PG_DSN: postgresql://skillmesh:skillmesh@postgres:5432/skillmesh
      SKILLMESH_WEB_PORT: 8080
      SKILLMESH_SETUP_CODE: ${SKILLMESH_SETUP_CODE:-}
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  neo4jdata:
  redisdata:
